name: Publish reviewed offline web game
on:
  workflow_dispatch:
    inputs:
      export_release:
        description: Release tag containing the reviewed web-offline.zip
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download reviewed game
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_RELEASE: ${{ inputs.export_release }}
        run: gh release download "$EXPORT_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern web-offline.zip --dir input
      - run: python3 ci/unpack-web.py input/web-offline.zip _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Publish HTTPS game
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
